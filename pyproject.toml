[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vocadb-tools"
version = "0.2.8"

[project.scripts]
check = "check:main"

[tool.setuptools]
py-modules = ["check"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vdbpy = { workspace = true }
vocadb-rules = { workspace = true }
vocadb-scripts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-m 'not integration and not slow and not rules'"
markers = [
    "integration: requires live VocaDB API",
    "slow: takes more than 10 seconds",
    "rules: rule-module checks against live entry versions",
]

[dependency-groups]
dev = [
    "vdbpy",
    "vocadb-rules",
    "vocadb-scripts",
    "coverage>=7.13.4",
    "genbadge>=1.1.2",
    "pydeps>=3.0.1",
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.15.2",
    "ty>=0.0.18",
]
