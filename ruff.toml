target-version = "py314"
exclude = [".venv", "WIP"]

[lint]
select = ["ALL"]
ignore = [
    "ANN",     # Missing return/type annotations
    "ARG001",  # Unused function argument
    "C901",    # Function too complex
    "COM812",  # Trailing comma missing
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in `__init__`
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "E501",    # Line too long
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "ERA001",  # Commented-out code
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "FIX002",  # Line contains TODO
    "G004",    # Logging statement uses f-string
    "INP001",  # Missing __init__.py
    "PERF401", # Replace for loop with extend / list comprehension
    "PGH003",  # Use specific rule codes when ignoring type issues
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR2004", # Magic values
    "PTH",     # `open()` should be replaced by `Path.open()`  TODO
    "S311",    # Standard pseudo-random generator
    "SIM102",  # Use a single `if` statement instead of nested `if` statements
    "TC001",   # Move application import into type-checking block
    "TC002",   # Move third-party import into type-checking block
    "TC003",   # Move standard library import into type-checking block
    "TD",      # Missing issue link for TODO
    "TRY002",  # Create your own exception
    "TRY003",  # Avoid specifying long messages outside the exception class
    "TRY300",  # try-consider-else
    "UP040",   # Type alias instead of the `type` keyword
]

[lint.per-file-ignores]
"packages/vocadb-rules/src/vocadb_rules/modules/*" = ["N999"]
"**/tests.py" = ["S101"]
"**/tests/*" = ["S101"]
