[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vocadb-scripts"
version = "4.1.1"
description = "Collection of VocaDB related scripts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kaleido==0.2.1",
    "plotly",
    "vdbpy",
]

[project.scripts]
vdb-sql = "vocadb_scripts.tools.sql:cli"
vdb-export-dms = "vocadb_scripts.tools.export_dms:cli"
vdb-export-rated-songs = "vocadb_scripts.tools.export_rated_song_entries_as_csv:cli"
vdb-notifs-to-songlist = "vocadb_scripts.tools.notifications_to_songlist:cli"
vdb-find-favourite-albums = "vocadb_scripts.find.favourite_albums:cli"
vdb-find-favourite-producers = "vocadb_scripts.find.favourite_producers:cli"
vdb-find-favourite-tags = "vocadb_scripts.find.favourite_tags:cli"
vdb-find-favourite-vocalists = "vocadb_scripts.find.favourite_vocalists:cli"
vdb-rating-diff = "vocadb_scripts.find.rating_diff:cli"
vdb-followed-artists-diff = "vocadb_scripts.find.followed_artists_diff:cli"
vdb-graph-monthly-comments = "vocadb_scripts.graph.monthly_comments:cli"
vdb-graph-monthly-edits = "vocadb_scripts.graph.monthly_edits:cli"
vdb-graph-monthly-entries = "vocadb_scripts.graph.monthly_entries:cli"
vdb-graph-monthly-users = "vocadb_scripts.graph.monthly_users:cli"
vdb-graph-rated-songs = "vocadb_scripts.graph.rated_songs_by_user:cli"
vdb-artist-tags-by-songs = "vocadb_scripts.artist_tags.calculate_by_songs:cli"
vdb-artist-tags-by-tag = "vocadb_scripts.artist_tags.most_relevant_by_tag:cli"
vdb-artist-tags-verify = "vocadb_scripts.artist_tags.verify:cli"
vdb-recommend = "vocadb_scripts.recommend.recommend_advanced:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
