[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vocadb-scripts"
version = "2.5.2"
description = "Collection of VocaDB related scripts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kaleido==0.2.1",
    "plotly",
    "vdbpy",
    "wcwidth>=0.6.0",
]

[project.scripts]
vdb-sql = "vocadb_scripts.tools.sql:cli"
vdb-export-dms = "vocadb_scripts.tools.export_dms:cli"
vdb-export-rated-songs = "vocadb_scripts.tools.export_rated_song_entries_as_csv:cli"
vdb-notifs-to-songlist = "vocadb_scripts.tools.notifications_to_songlist:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
