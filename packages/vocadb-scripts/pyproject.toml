[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vocadb-scripts"
version = "2.5.2"
description = "Collection of VocaDB related scripts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kaleido==0.2.1",
    "plotly",
    "vdbpy",
    "wcwidth>=0.6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
