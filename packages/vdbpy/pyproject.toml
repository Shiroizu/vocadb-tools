[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vdbpy"
version = "25.0.0"
description = "Base library for working with https://github.com/VocaDB/vocadb"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "diskcache==5.6.3",
    "orjson>=3.11",
    "plotly==5.17.0",
    "plotly-stubs==0.1.2",
    "python-dateutil==2.9.0.post0",
    "requests==2.32.4",
    "sqlalchemy>=2.0",
    "tabulate==0.9.0",
    "wcwidth>=0.6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
