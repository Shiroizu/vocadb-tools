[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocadb-rules"
version = "1.0.0"
description = "VocaDB rule check modules"
readme = "README.md"
license = "MIT"
authors = [{ name = "Shiroizu" }]
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "requests>=2.32.4",
    "vdbpy",
]

[project.urls]
Repository = "https://github.com/Shiroizu/vocadb-tools"
Issues = "https://github.com/Shiroizu/vocadb-tools/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["vocadb_rules*"]

[tool.setuptools.package-data]
"vocadb_rules.modules" = ["*.py"]
